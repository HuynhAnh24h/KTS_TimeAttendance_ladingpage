name: KTS License CD Deploy to Render

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Webhook
    runs-on: ubuntu-latest
    needs: [] # Có thể chạy song song hoặc sau CI

    steps:
      - name: Trigger Webhook Deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Đang gửi tín hiệu Deploy tự động tới Render.com..."
          curl -X POST -I "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Đã gửi tín hiệu Deploy thành công!"
