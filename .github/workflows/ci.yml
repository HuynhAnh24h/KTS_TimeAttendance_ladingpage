name: KTS License CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            license-server/server/package-lock.json
            license-server/client/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Run Backend & License Algorithm Tests
        run: |
          cd server
          npm test

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build React Client (Vite)
        run: |
          cd client
          npm run build

      - name: Verify Build Artifacts
        run: |
          test -f client/dist/index.html && echo "Frontend build successful!"
